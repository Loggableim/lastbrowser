<style>

  body {
    background: #0a0e17;

    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;

    justify-content: center;

    text-align: center;
  }
  .container { max-width: 560px; }
  .logo { font-size: 28px; font-weight: 800; letter-spacing: -.03em; margin-bottom: 8px; }

  .tagline { font-size: 15px; color: #94a3b8; margin-bottom: 40px; }
  h1 { font-size: clamp(32px, 6vw, 52px); font-weight: 700; letter-spacing: -.04em; line-height: 1.1; margin-bottom: 16px; }

  p { font-size: 16px; line-height: 1.7; color: #94a3b8; margin-bottom: 32px; max-width: 480px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 28px; border-radius: 12px;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: #fff; font-size: 15px; font-weight: 600;
    text-decoration: none; transition: transform .15s, box-shadow .15s;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(37,99,235,.3); }
  .btn svg { width: 18px; height: 18px; }
  .footer { margin-top: 48px; font-size: 13px; color: #475569; }
  .footer a { color: #64748b; text-decoration: none; }
  .footer a:hover { color: #94a3b8; }
