<!DOCTYPE html>
<html lang="de" class="theme-dark" data-accent="neon-cyan">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data: blob:;">
<title>LastBrowser — Imagine Plugin UI Design Demo</title>
<style>
/* ============================================================================
   1. LASTBROWSER CORE & THEME TOKENS (aus styles.css / appearance.css)
   ============================================================================ */
:root {
  --font-sans: Inter, Outfit, "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-display: Outfit, Inter, "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "Cascadia Code", "SFMono-Regular", Consolas, monospace;

  /* Default Accent: Neon Cyan */
  --accent-primary: #00d9ff;
  --accent-secondary: #0099cc;
  --accent-glow: rgba(0, 217, 255, 0.25);

  /* Dark Theme (Default) */
  --lb-bg: #07111f;
  --lb-bg-alt: #0a1324;
  --lb-accent: var(--accent-primary, #00d9ff);
  --lb-accent-soft: color-mix(in srgb, var(--lb-accent) 14%, transparent);
  --lb-surface: rgba(7, 17, 31, 0.76);
  --lb-surface-strong: rgba(8, 11, 25, 0.94);
  --lb-surface-panel: rgba(16, 15, 32, 0.94);
  --lb-surface-elevated: rgba(24, 26, 48, 0.92);
  --lb-border: rgba(255, 255, 255, 0.09);
  --lb-border-strong: rgba(255, 255, 255, 0.18);
  --lb-text: #f8fbff;
  --lb-muted: rgba(232, 242, 255, 0.72);
  --lb-subtle: rgba(232, 242, 255, 0.52);

  /* Imagine Studio Secondary Playful Palette */
  --imagine-joy-pink: #f43f5e;
  --imagine-joy-violet: #a855f7;
  --imagine-joy-amber: #f59e0b;
  --imagine-joy-emerald: #10b981;
  --imagine-stage-bg: radial-gradient(circle at 20% 15%, color-mix(in srgb, var(--lb-accent) 12%, transparent), transparent 45%),
                      radial-gradient(circle at 82% 80%, rgba(168, 85, 247, 0.12), transparent 50%),
                      linear-gradient(160deg, #050c18 0%, #0a1428 55%, #0c1224 100%);
  --imagine-card-bg: rgba(17, 25, 44, 0.82);
  --imagine-card-hover: rgba(26, 37, 64, 0.95);
  --imagine-glass-blur: blur(16px);
  --imagine-shadow: 0 14px 36px rgba(0, 0, 0, 0.42);
  --imagine-radius-lg: 16px;
  --imagine-radius-md: 12px;
  --imagine-radius-sm: 8px;
  --imagine-target-min: 36px;

  /* Status Colors */
  --status-ok: #10b981;
  --status-warn: #f59e0b;
  --status-err: #ef4444;
  --status-info: #38bdf8;

  /* Motion Tokens */
  --ease-spring: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-fast: 160ms;
  --dur-med: 280ms;
  --dur-slow: 520ms;
}

/* Accent Presets (aus appearance.css) */
html[data-accent="neon-cyan"] {
  --accent-primary: #00d9ff;
  --accent-secondary: #0099cc;
  --accent-glow: rgba(0, 217, 255, 0.25);
}
html[data-accent="electric-violet"] {
  --accent-primary: #a855f7;
  --accent-secondary: #9333ea;
  --accent-glow: rgba(168, 85, 247, 0.25);
}
html[data-accent="emerald-flow"] {
  --accent-primary: #10b981;
  --accent-secondary: #059669;
  --accent-glow: rgba(16, 185, 129, 0.25);
}
html[data-accent="solar-amber"] {
  --accent-primary: #f59e0b;
  --accent-secondary: #d97706;
  --accent-glow: rgba(245, 158, 11, 0.25);
}
html[data-accent="monochrome-slate"] {
  --accent-primary: #94a3b8;
  --accent-secondary: #64748b;
  --accent-glow: rgba(148, 163, 184, 0.25);
}

/* Light Theme */
html.theme-light {
  --lb-bg: #edf3fb;
  --lb-bg-alt: #f6f9fe;
  --lb-surface: rgba(255, 255, 255, 0.88);
  --lb-surface-strong: rgba(255, 255, 255, 0.97);
  --lb-surface-panel: rgba(244, 248, 255, 0.96);
  --lb-surface-elevated: #ffffff;
  --lb-border: rgba(7, 17, 31, 0.12);
  --lb-border-strong: rgba(7, 17, 31, 0.24);
  --lb-text: #0c1624;
  --lb-muted: rgba(12, 22, 36, 0.72);
  --lb-subtle: rgba(12, 22, 36, 0.56);
  --lb-accent-soft: color-mix(in srgb, var(--lb-accent) 16%, transparent);
  --imagine-stage-bg: radial-gradient(circle at 20% 15%, color-mix(in srgb, var(--lb-accent) 14%, transparent), transparent 45%),
                      radial-gradient(circle at 82% 80%, rgba(168, 85, 247, 0.10), transparent 50%),
                      linear-gradient(160deg, #e8f0fb 0%, #f3f7fd 55%, #edf2fa 100%);
  --imagine-card-bg: rgba(255, 255, 255, 0.92);
  --imagine-card-hover: #ffffff;
  --imagine-shadow: 0 12px 32px rgba(12, 22, 36, 0.08);
  --status-ok: #047857;
  --status-warn: #b45309;
  --status-err: #b91c1c;
  --status-info: #0369a1;
}
/* Ensure accessible accent contrast in Light theme */
html.theme-light[data-accent="neon-cyan"] { --lb-accent: #007799; }
html.theme-light[data-accent="emerald-flow"] { --lb-accent: #047857; }
html.theme-light[data-accent="solar-amber"] { --lb-accent: #b45309; }
html.theme-light[data-accent="monochrome-slate"] { --lb-accent: #334155; }

/* Vision Impaired Theme: Pure Maximal Contrast (#000000 / #FFFFFF, no blur, min 48px targets) */
html.theme-vision-impaired {
  --font-sans: Arial, Helvetica, sans-serif;
  --font-display: Arial, Helvetica, sans-serif;
  --lb-bg: #000000;
  --lb-bg-alt: #000000;
  --lb-surface: #000000;
  --lb-surface-strong: #000000;
  --lb-surface-panel: #000000;
  --lb-surface-elevated: #000000;
  --lb-border: #ffffff;
  --lb-border-strong: #ffffff;
  --lb-text: #ffffff;
  --lb-muted: #ffffff;
  --lb-subtle: #ffffff;
  --lb-accent: #ffffff;
  --lb-accent-soft: #222222;
  --imagine-stage-bg: #000000;
  --imagine-card-bg: #000000;
  --imagine-card-hover: #1a1a1a;
  --imagine-glass-blur: none;
  --imagine-shadow: none;
  --imagine-target-min: 48px;
  --status-ok: #ffffff;
  --status-warn: #ffffff;
  --status-err: #ffffff;
  --status-info: #ffffff;
  font-size: 16px;
  line-height: 1.5;
}

/* Reduced Motion */
@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-fast: 120ms;
    --dur-med: 150ms;
    --dur-slow: 180ms;
  }
}
html[data-reduced-motion="true"] {
  --dur-fast: 120ms;
  --dur-med: 150ms;
  --dur-slow: 180ms;
}

/* ============================================================================
   2. RESET & BASE LAYOUT
   ============================================================================ */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--font-sans);
  background: var(--lb-bg);
  color: var(--lb-text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  background: none;
  border: 1px solid transparent;
  min-height: var(--imagine-target-min);
  transition: background var(--dur-fast) var(--ease-out),
              border-color var(--dur-fast) var(--ease-out),
              transform var(--dur-fast) var(--ease-spring),
              opacity var(--dur-fast) ease;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.48;
}

/* Visible Focus Ring (WCAG 2.2 AA/AAA) */
:focus-visible {
  outline: 3px solid var(--lb-accent);
  outline-offset: 2px;
}
html.theme-vision-impaired :focus-visible {
  outline: 4px solid #ffffff;
  outline-offset: 3px;
  box-shadow: 0 0 0 6px #000000;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* ============================================================================
   3. DEMO CONTROL BAR (Steuerleiste oben)
   ============================================================================ */
.demo-harness {
  background: var(--lb-surface-strong);
  border-bottom: 2px solid var(--lb-border-strong);
  padding: 8px 14px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px 14px;
  align-items: center;
  justify-content: space-between;
  z-index: 100;
  font-size: 12px;
}
html.theme-vision-impaired .demo-harness {
  border-bottom: 3px solid #ffffff;
  font-size: 14px;
}

.demo-harness-group {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}

.demo-harness-label {
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--lb-muted);
  font-size: 10px;
  margin-right: 2px;
}
html.theme-vision-impaired .demo-harness-label {
  font-size: 13px;
  text-decoration: underline;
}

.demo-select, .demo-chip {
  background: var(--lb-surface-elevated);
  border: 1px solid var(--lb-border-strong);
  border-radius: 6px;
  padding: 4px 8px;
  font-size: 12px;
  min-height: 30px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
html.theme-vision-impaired .demo-select,
html.theme-vision-impaired .demo-chip {
  min-height: 48px;
  border-width: 2px;
  font-size: 15px;
  font-weight: 700;
}
.demo-chip[aria-pressed="true"] {
  background: var(--lb-accent-soft);
  border-color: var(--lb-accent);
  font-weight: 700;
}
html.theme-vision-impaired .demo-chip[aria-pressed="true"] {
  background: #ffffff;
  color: #000000;
}

.accent-swatch-bar {
  display: inline-flex;
  gap: 4px;
  align-items: center;
}
.accent-dot {
  width: 22px;
  height: 22px;
  min-height: 22px;
  border-radius: 999px;
  border: 2px solid transparent;
  padding: 0;
}
html.theme-vision-impaired .accent-dot {
  width: 48px;
  height: 48px;
  min-height: 48px;
  border: 2px solid #ffffff;
}
.accent-dot[aria-pressed="true"] {
  border-color: var(--lb-text);
  transform: scale(1.15);
}

/* ============================================================================
   4. LASTBROWSER SHELL CHROME (Topbar + Main Workspace)
   ============================================================================ */
.lb-shell {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: var(--imagine-stage-bg);
  min-height: calc(100vh - 54px);
}

/* Plugin Sub-Header Navigation */
.imagine-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 10px 20px;
  background: var(--lb-surface);
  backdrop-filter: var(--imagine-glass-blur);
  border-bottom: 1px solid var(--lb-border);
  flex-wrap: wrap;
}
html.theme-vision-impaired .imagine-topbar {
  border-bottom: 2px solid #ffffff;
}

.imagine-brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.imagine-logo-badge {
  width: 38px;
  height: 38px;
  border-radius: 11px;
  background: linear-gradient(135deg, var(--lb-accent), var(--imagine-joy-violet), var(--imagine-joy-pink));
  display: grid;
  place-items: center;
  color: #ffffff;
  box-shadow: 0 4px 16px var(--accent-glow);
  font-weight: 800;
}
html.theme-vision-impaired .imagine-logo-badge {
  background: #ffffff;
  color: #000000;
  border: 2px solid #ffffff;
  box-shadow: none;
}

.imagine-brand-titles {
  display: flex;
  flex-direction: column;
}
.imagine-brand-title {
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 800;
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  gap: 8px;
}
.imagine-brand-sub {
  font-size: 12px;
  color: var(--lb-muted);
}

/* Primary Plugin Navigation (Erzeugen | Warteschlange | Galerie | Einstellungen) */
.imagine-nav {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--lb-surface-panel);
  padding: 4px;
  border-radius: 12px;
  border: 1px solid var(--lb-border);
}
html.theme-vision-impaired .imagine-nav {
  border: 2px solid #ffffff;
  padding: 6px;
}

.imagine-nav-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 14px;
  border-radius: 9px;
  font-size: 13px;
  font-weight: 600;
  color: var(--lb-muted);
  border: 1px solid transparent;
}
.imagine-nav-btn:hover {
  color: var(--lb-text);
  background: rgba(255, 255, 255, 0.04);
}
.imagine-nav-btn[aria-current="page"] {
  background: var(--lb-accent-soft);
  color: var(--lb-text);
  border-color: var(--lb-accent);
  font-weight: 700;
}
html.theme-vision-impaired .imagine-nav-btn[aria-current="page"] {
  background: #ffffff;
  color: #000000;
  border: 2px solid #ffffff;
}

.nav-badge {
  font-size: 11px;
  padding: 1px 7px;
  border-radius: 999px;
  background: var(--lb-accent);
  color: #04101c;
  font-weight: 800;
}
html.theme-light .nav-badge {
  color: #ffffff;
}
html.theme-vision-impaired .nav-badge {
  background: #000000;
  color: #ffffff;
  border: 2px solid currentColor;
}

/* Engine Status Pill in Header */
.engine-status-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--lb-surface-panel);
  border: 1px solid var(--lb-border);
  font-size: 12px;
  font-weight: 600;
}
html.theme-vision-impaired .engine-status-pill {
  border: 2px solid #ffffff;
}
.status-led {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--status-ok);
  box-shadow: 0 0 8px var(--status-ok);
}
.status-led.warn { background: var(--status-warn); box-shadow: 0 0 8px var(--status-warn); }
.status-led.err { background: var(--status-err); box-shadow: 0 0 8px var(--status-err); }
html.theme-vision-impaired .status-led {
  width: 12px;
  height: 12px;
  box-shadow: none;
  border: 2px solid #ffffff;
}

/* ============================================================================
   5. MAIN STUDIO WORKSPACE (3-Spalten Responsiv: 900px bis 2560px)
   ============================================================================ */
.imagine-workspace {
  flex: 1;
  display: grid;
  grid-template-columns: 330px minmax(0, 1fr) 350px;
  gap: 16px;
  padding: 16px 20px;
  max-width: 2560px;
  width: 100%;
  margin: 0 auto;
  align-items: start;
}

@media (max-width: 1320px) {
  .imagine-workspace {
    grid-template-columns: 300px minmax(0, 1fr);
  }
  .imagine-sidekick-col {
    grid-column: 1 / -1;
  }
}

@media (max-width: 980px) {
  .imagine-workspace {
    grid-template-columns: 1fr;
    padding: 12px;
  }
}

/* Panel Container Styling */
.studio-panel {
  background: var(--lb-surface-panel);
  backdrop-filter: var(--imagine-glass-blur);
  border: 1px solid var(--lb-border);
  border-radius: var(--imagine-radius-lg);
  box-shadow: var(--imagine-shadow);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
html.theme-vision-impaired .studio-panel {
  border: 2px solid #ffffff;
}

.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.panel-title {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ============================================================================
   6. MODE SWITCHER (Erzeugen | Bild → Bild | Inpainting | Upscale)
   ============================================================================ */
.mode-tabs {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 6px;
  background: var(--lb-surface);
  padding: 5px;
  border-radius: 12px;
  border: 1px solid var(--lb-border);
}
html.theme-vision-impaired .mode-tabs {
  border: 2px solid #ffffff;
}

.mode-tab-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  color: var(--lb-muted);
  border: 1px solid transparent;
}
.mode-tab-btn[aria-selected="true"] {
  background: var(--lb-accent-soft);
  color: var(--lb-text);
  border-color: var(--lb-accent);
  font-weight: 700;
}
html.theme-vision-impaired .mode-tab-btn[aria-selected="true"] {
  background: #ffffff;
  color: #000000;
}

/* ============================================================================
   7. ENGINE SETTINGS & DATA-DRIVEN CAPABILITIES
   ============================================================================ */
.control-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.control-label-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  font-weight: 600;
}
.control-val-badge {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--lb-accent);
  background: var(--lb-accent-soft);
  padding: 2px 6px;
  border-radius: 5px;
}
html.theme-vision-impaired .control-val-badge {
  border: 1px solid #ffffff;
  color: #ffffff;
  background: #000000;
}

.aspect-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}
.aspect-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 7px 4px;
  border-radius: 8px;
  background: var(--imagine-card-bg);
  border: 1px solid var(--lb-border);
  font-size: 11px;
  font-weight: 600;
}
.aspect-btn[aria-pressed="true"] {
  border-color: var(--lb-accent);
  background: var(--lb-accent-soft);
  font-weight: 700;
}
html.theme-vision-impaired .aspect-btn[aria-pressed="true"] {
  background: #ffffff;
  color: #000000;
  border: 2px solid #ffffff;
}
.aspect-frame {
  border: 1.5px solid currentColor;
  border-radius: 2px;
}

.studio-input, .studio-select, .studio-textarea {
  width: 100%;
  background: var(--imagine-card-bg);
  border: 1px solid var(--lb-border-strong);
  border-radius: 9px;
  padding: 8px 11px;
  font-size: 13px;
  color: var(--lb-text);
  min-height: var(--imagine-target-min);
}
html.theme-vision-impaired .studio-input,
html.theme-vision-impaired .studio-select,
html.theme-vision-impaired .studio-textarea {
  border: 2px solid #ffffff;
  font-size: 16px;
}

.studio-range {
  width: 100%;
  accent-color: var(--lb-accent);
  min-height: 24px;
  cursor: pointer;
}
html.theme-vision-impaired .studio-range {
  min-height: 48px;
}

.pro-toggle-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 9px 12px;
  border-radius: 10px;
  background: var(--imagine-card-bg);
  border: 1px dashed var(--lb-border-strong);
  font-size: 12px;
  font-weight: 700;
}
html.theme-vision-impaired .pro-toggle-btn {
  border: 2px solid #ffffff;
}

.pro-drawer {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--lb-border);
}

.capability-notice {
  font-size: 11px;
  color: var(--lb-muted);
  background: var(--lb-surface);
  border-left: 3px solid var(--lb-accent);
  padding: 8px 10px;
  border-radius: 6px;
  line-height: 1.4;
}
html.theme-vision-impaired .capability-notice {
  border: 2px solid #ffffff;
  font-size: 14px;
}

.seed-row {
  display: flex;
  gap: 6px;
}
.icon-btn {
  padding: 6px 10px;
  border-radius: 8px;
  background: var(--imagine-card-bg);
  border: 1px solid var(--lb-border-strong);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 600;
}
.icon-btn:hover:not(:disabled) {
  border-color: var(--lb-accent);
  background: var(--imagine-card-hover);
}
html.theme-vision-impaired .icon-btn {
  border: 2px solid #ffffff;
}

/* ============================================================================
   8. CENTER STAGE: PROMPT DOCK, CANVAS STAGE, TEMPLATES
   ============================================================================ */
.imagine-center-col {
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-width: 0;
}

/* Prompt Dock */
.prompt-dock {
  background: var(--lb-surface-panel);
  border: 1.5px solid var(--lb-border-strong);
  border-radius: var(--imagine-radius-lg);
  padding: 14px;
  box-shadow: var(--imagine-shadow);
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: border-color var(--dur-fast) ease;
}
.prompt-dock:focus-within {
  border-color: var(--lb-accent);
}
html.theme-vision-impaired .prompt-dock {
  border: 3px solid #ffffff;
}

.prompt-textarea {
  width: 100%;
  min-height: 76px;
  background: transparent;
  border: none;
  resize: vertical;
  font-size: 15px;
  line-height: 1.5;

/* Avatar v2 State Animations (GPU friendly transform & opacity) */
@keyframes avFloat {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-3px); }
}
@keyframes avSpinCW {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
@keyframes avSpinCCW {
  from { transform: rotate(360deg); }
  to { transform: rotate(0deg); }
}
@keyframes avPulse {
  0%, 100% { opacity: 0.55; transform: scale(0.96); }
  50% { opacity: 1; transform: scale(1.04); }
}
@keyframes avShake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-3px); }
  75% { transform: translateX(3px); }
}

.av-root {
  transform-origin: 60px 60px;
  animation: avFloat 3.6s ease-in-out infinite;
}
.av-ring-cw {
  transform-origin: 60px 60px;
  animation: avSpinCW 10s linear infinite;
}
.av-ring-ccw {
  transform-origin: 60px 60px;
  animation: avSpinCCW 14s linear infinite;
}
.av-core-pulse {
  transform-origin: 60px 60px;
  animation: avPulse 2.4s ease-in-out infinite;
}
.av-state-working .av-ring-cw {
  animation-duration: 2.6s;
}
.av-state-thinking .av-ring-cw {
  animation-duration: 5s;
}
.av-state-error .av-root {
  animation: avShake 0.35s ease-in-out 3;
}

/* Respect Reduced Motion in Avatar v2 */
html[data-reduced-motion="true"] .av-root,
html[data-reduced-motion="true"] .av-ring-cw,
html[data-reduced-motion="true"] .av-ring-ccw,
html[data-reduced-motion="true"] .av-core-pulse {
  animation: none !important;
}

    case "waiting": return "thinking";
    case "done": return "done";
    case "error": return "error";
    case "no-engine": return "needs-input";
    default: return "idle";

}

  ringCW.setAttribute("r", "48");
  ringCW.setAttribute("fill", "none");
  ringCW.setAttribute("stroke", c1);
  ringCW.setAttribute("stroke-width", isVI ? "3" : "2");
  ringCW.setAttribute("stroke-dasharray", personaKey === "patch" ? "8 6" : "22 10 6 10");
  ringCW.setAttribute("class", "av-ring-cw");
  svg.appendChild(ringCW);

  // Counter-rotating inner ring
  const ringCCW = document.createElementNS(ns, "circle");
  ringCCW.setAttribute("cx", "60");
  ringCCW.setAttribute("cy", "60");
  ringCCW.setAttribute("r", "38");
  ringCCW.setAttribute("fill", "none");
  ringCCW.setAttribute("stroke", c2);
  ringCCW.setAttribute("stroke-width", isVI ? "2.5" : "1.5");
  ringCCW.setAttribute("stroke-dasharray", "12 14");
  ringCCW.setAttribute("class", "av-ring-ccw");
  svg.appendChild(ringCCW);

  // Core group
  const rootG = document.createElementNS(ns, "g");
  rootG.setAttribute("class", "av-root");

  // Core body shape varies by Persona (v2 geometry)
  if (personaKey === "orion" || personaKey === "patch") {
    const poly = document.createElementNS(ns, "polygon");
    poly.setAttribute("points", "60,26 90,43 90,77 60,94 30,77 30,43");
    poly.setAttribute("fill", isVI ? "#000000" : "rgba(15,23,42,0.9)");
    poly.setAttribute("stroke", c1);
    poly.setAttribute("stroke-width", "3");
    rootG.appendChild(poly);
  } else {
    const core = document.createElementNS(ns, "circle");
    core.setAttribute("cx", "60");
    core.setAttribute("cy", "60");
    core.setAttribute("r", "30");
    core.setAttribute("fill", isVI ? "#000000" : "rgba(15,23,42,0.9)");
    core.setAttribute("stroke", c1);
    core.setAttribute("stroke-width", "3");
    rootG.appendChild(core);
  }

  // Eyes / Visor expression based on state
  const eyesG = document.createElementNS(ns, "g");
  if (avState === "error") {
    const p1 = document.createElementNS(ns, "path");
    p1.setAttribute("d", "M44,52 L54,62 M54,52 L44,62 M66,52 L76,62 M76,52 L66,62");
    p1.setAttribute("stroke", isVI ? "#ffffff" : "#ef4444");
    p1.setAttribute("stroke-width", "3.5");
    p1.setAttribute("stroke-linecap", "round");
    eyesG.appendChild(p1);
  } else if (avState === "done") {
    const p1 = document.createElementNS(ns, "path");
    p1.setAttribute("d", "M43,58 Q49,50 55,58 M65,58 Q71,50 77,58");
    p1.setAttribute("fill", "none");
    p1.setAttribute("stroke", c1);
    p1.setAttribute("stroke-width", "3.5");
    p1.setAttribute("stroke-linecap", "round");
    eyesG.appendChild(p1);
  } else {
    const eyeL = document.createElementNS(ns, "ellipse");
    eyeL.setAttribute("cx", "49");
    eyeL.setAttribute("cy", "57");
    eyeL.setAttribute("rx", "4.5");
    eyeL.setAttribute("ry", avState === "thinking" ? "2.5" : "6");
    eyeL.setAttribute("fill", c1);
    const eyeR = document.createElementNS(ns, "ellipse");
    eyeR.setAttribute("cx", "71");
    eyeR.setAttribute("cy", "57");
    eyeR.setAttribute("rx", "4.5");
    eyeR.setAttribute("ry", avState === "thinking" ? "2.5" : "6");
    eyeR.setAttribute("fill", c1);
    eyesG.appendChild(eyeL);
    eyesG.appendChild(eyeR);
  }
  rootG.appendChild(eyesG);

  // Status badge indicator in corner
  const badge = document.createElementNS(ns, "circle");
  badge.setAttribute("cx", "92");
  badge.setAttribute("cy", "92");
  badge.setAttribute("r", "10");
  badge.setAttribute("fill", isVI ? "#000000" : c2);
  badge.setAttribute("stroke", "#ffffff");
  badge.setAttribute("stroke-width", "2");
  rootG.appendChild(badge);

  svg.appendChild(rootG);
  return svg;
}

/* ============================================================================
   PROZEDURALER CANVAS-GENERATOR FÜR VORSCHAU-, NOISE-, INPAINT- & UPSCALE-BILDER
   ============================================================================ */
function renderProceduralArtwork(canvas, options) {
  const ctx = canvas.getContext("2d");
  const w = canvas.width;
  const h = canvas.height;
  const isVI = state.theme === "theme-vision-impaired";
  const hue = options.hue || 195;
  const noiseLevel = options.noiseLevel || 0; // 0.0 (sharp) to 1.0 (pure noise)

  ctx.clearRect(0, 0, w, h);

  if (isVI) {
    // High contrast black & white geometric illustration for Vision Impaired mode
    ctx.fillStyle = "#000000";
    ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 4;
    for (let i = 20; i < w; i += 48) {
      ctx.beginPath();
      ctx.moveTo(i, 0);
      ctx.lineTo(w - i, h);
      ctx.stroke();
    }
    ctx.fillStyle = "#000000";
    ctx.beginPath();
    ctx.arc(w * 0.5, h * 0.45, Math.min(w, h) * 0.24, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 18px Arial";
    ctx.textAlign = "center";
    ctx.fillText(options.caption || "LOKALES RENDER-ERGEBNIS", w / 2, h - 24);
    return;
  }

  // Rich atmospheric gradient background
  const grad = ctx.createLinearGradient(0, 0, w, h);
  grad.addColorStop(0, `hsl(${hue}, 78%, 14%)`);
  grad.addColorStop(0.5, `hsl(${(hue + 45) % 360}, 72%, 26%)`);
  grad.addColorStop(1, `hsl(${(hue + 95) % 360}, 82%, 18%)`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  // Glowing sun / neon orb
  const radGrad = ctx.createRadialGradient(w * 0.52, h * 0.42, 8, w * 0.52, h * 0.42, Math.min(w, h) * 0.38);
  radGrad.addColorStop(0, `hsla(${(hue + 30) % 360}, 100%, 82%, 0.95)`);
  radGrad.addColorStop(0.45, `hsla(${hue}, 95%, 58%, 0.55)`);
  radGrad.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = radGrad;
  ctx.fillRect(0, 0, w, h);

  // Stylized architectural / horizon silhouettes
  ctx.fillStyle = "rgba(6, 11, 23, 0.78)";
  ctx.beginPath();
  ctx.moveTo(0, h);
  ctx.lineTo(0, h * 0.68);
  ctx.lineTo(w * 0.22, h * 0.54);
  ctx.lineTo(w * 0.44, h * 0.64);
  ctx.lineTo(w * 0.68, h * 0.46);
  ctx.lineTo(w * 0.88, h * 0.60);
  ctx.lineTo(w, h * 0.52);
  ctx.lineTo(w, h);
  ctx.closePath();
  ctx.fill();

  // Foreground neon reflections
  ctx.strokeStyle = `hsla(${hue}, 100%, 75%, 0.65)`;
  ctx.lineWidth = 2;
  for (let y = h * 0.74; y < h; y += 9) {
    ctx.beginPath();
    ctx.moveTo(w * 0.15, y);
    ctx.lineTo(w * 0.85, y);
    ctx.stroke();
  }

  // If generating (noise-to-light reveal effect)
  if (noiseLevel > 0) {
    const dots = Math.floor(noiseLevel * 900);
    for (let i = 0; i < dots; i++) {
      const rx = (Math.sin(i * 78.233) * 0.5 + 0.5) * w;
      const ry = (Math.cos(i * 45.164) * 0.5 + 0.5) * h;
      ctx.fillStyle = i % 2 === 0 ? "rgba(0, 217, 255, 0.35)" : "rgba(255, 255, 255, 0.28)";
      ctx.fillRect(rx, ry, 4, 4);
    }
  }

  // If Upscale Split view
  if (options.upscaleSplit) {
    const splitX = (options.upscaleSplit / 100) * w;
    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,0.32)";
    ctx.fillRect(0, 0, splitX, h);
    ctx.strokeStyle = "#00d9ff";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(splitX, 0);
    ctx.lineTo(splitX, h);
    ctx.stroke();

    ctx.fillStyle = "rgba(7, 17, 31, 0.86)";
    ctx.fillRect(12, 12, 118, 26);
    ctx.fillRect(w - 144, 12, 132, 26);
    ctx.fillStyle = "#ffffff";
    ctx.font = "600 12px sans-serif";
    ctx.fillText("Vorher (1024 px)", 20, 29);
    ctx.fillText(`Nachher (${state.upscaleFactor}× HD)`, w - 134, 29);
    ctx.restore();
  }

  // Caption badge
  if (options.caption) {
    ctx.fillStyle = "rgba(7, 17, 31, 0.78)";
    ctx.fillRect(10, h - 34, Math.min(w - 20, 290), 24);
    ctx.fillStyle = "#f8fbff";
    ctx.font = "600 11px sans-serif";
    ctx.fillText(options.caption, 18, h - 18);
  }
}

/* ============================================================================
   DOM HELPER (CSP-Safe Element Creation)
   ============================================================================ */
function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined) continue;
    if (k === "className") node.className = v;
    else if (k === "textContent") node.textContent = v;
    else if (k.startsWith("on") && typeof v === "function") {
      node.addEventListener(k.slice(2).toLowerCase(), v);
    } else {
      node.setAttribute(k, String(v));
    }
  }
  for (const child of children) {
    if (!child) continue;
    if (typeof child === "string") node.appendChild(document.createTextNode(child));
    else node.appendChild(child);
  }
  return node;
}

      el("strong", { textContent: "Bild → Bild Quelle aktiv: " }),

    ]));
    leftCol.appendChild(el("div", { className: "control-group" }, [
      el("div", { className: "control-label-row" }, [
        el("label", { for: "rng-img2img", textContent: "Denoising / Änderungs-Stärke" }),
        el("span", { className: "control-val-badge", textContent: state.img2imgStrength + " %" })
      ]),
      el("input", {
        id: "rng-img2img",
        type: "range",
        className: "studio-range",
        min: 10, max: 95, value: state.img2imgStrength,
        onInput: (e) => { state.img2imgStrength = Number(e.target.value); renderApp(); }
      })
    ]));
  } else if (state.mode === "inpaint") {
    leftCol.appendChild(el("div", { className: "control-group" }, [
      el("div", { className: "control-label-row" }, [
        el("span", { textContent: "Inpainting-Werkzeug (direkt auf Leinwand malen)" }),
        el("span", { className: "control-val-badge", textContent: state.inpaintBrushSize + " px" })
      ]),
      el("div", { className: "seed-row" }, [
        el("button", {
          type: "button",
          className: "icon-btn",
          "aria-pressed": state.inpaintTool === "brush",
          onClick: () => { state.inpaintTool = "brush"; renderApp(); }
        }, ["🖌️ Pinsel"]),
        el("button", {
          type: "button",
          className: "icon-btn",
          "aria-pressed": state.inpaintTool === "eraser",
          onClick: () => { state.inpaintTool = "eraser"; renderApp(); }
        }, ["🧽 Radierer"]),
        el("button", {
          type: "button",
          className: "icon-btn",
          "aria-pressed": state.inpaintInverted,
          onClick: () => {
            state.inpaintInverted = !state.inpaintInverted;
            renderApp();
            showToast(state.inpaintInverted ? "Maske invertiert" : "Maske normal");
          }
        }, ["⇄ Invertieren"])
      ]),
      el("input", {
        type: "range",
        className: "studio-range",
        "aria-label": "Pinselgröße in Pixel",
        min: 8, max: 64, value: state.inpaintBrushSize,
        onInput: (e) => { state.inpaintBrushSize = Number(e.target.value); renderApp(); }
      })
    ]));
  } else if (state.mode === "upscale") {
    leftCol.appendChild(el("div", { className: "control-group" }, [
      el("div", { className: "control-label-row" }, [
        el("span", { textContent: "Upscale-Faktor (RealESRGAN / Latent)" }),
        el("span", { className: "control-val-badge", textContent: state.upscaleFactor + "×" })
      ]),
      el("div", { className: "seed-row" }, [
        el("button", {
          type: "button",
          className: "icon-btn",
          "aria-pressed": state.upscaleFactor === 2,
          onClick: () => { state.upscaleFactor = 2; renderApp(); }
        }, ["2× (2048 × 2048)"]),
        el("button", {
          type: "button",
          className: "icon-btn",
          "aria-pressed": state.upscaleFactor === 4,
          onClick: () => { state.upscaleFactor = 4; renderApp(); }
        }, ["4× (4096 × 4096)"])
      ])
    ]));
  }

  // Schnell-Defaults (Format, Anzahl, Stil-Stärke sofern unterstützt)
  leftCol.appendChild(el("div", { className: "control-group" }, [
    el("div", { className: "control-label-row" }, [
      el("span", { textContent: t("aspectLabel") }),
      el("span", { className: "control-val-badge", textContent: state.aspectRatio })
    ]),
    (() => {
      const grid = el("div", { className: "aspect-grid", role: "group", "aria-label": t("aspectLabel") });
      cap.aspectRatios.forEach(ar => {
        grid.appendChild(el("button", {
          type: "button",
          className: "aspect-btn",
          "aria-pressed": state.aspectRatio === ar.id ? "true" : "false",
          disabled: isNoEngine ? "disabled" : null,
          onClick: () => { state.aspectRatio = ar.id; renderApp(); }
        }, [
          el("span", { className: "aspect-frame", style: `width:${ar.boxW}px;height:${ar.boxH}px;` }),
          el("span", { textContent: ar.label })
        ]));
      });
      return grid;
    })()
  ]));

  // Batch Count
  leftCol.appendChild(el("div", { className: "control-group" }, [
    el("div", { className: "control-label-row" }, [
      el("label", { for: "rng-batch", textContent: t("countLabel") }),
      el("span", { className: "control-val-badge", textContent: Math.min(state.batchCount, cap.maxBatch) + " / " + cap.maxBatch })
    ]),
    el("input", {
      id: "rng-batch",
      type: "range",
      className: "studio-range",
      min: 1,
      max: cap.maxBatch,
      value: Math.min(state.batchCount, cap.maxBatch),
      disabled: isNoEngine ? "disabled" : null,
      onInput: (e) => { state.batchCount = Number(e.target.value); renderApp(); }
    })
  ]));

  // Style Strength (nur wenn Engine es unterstützt!)
  if (cap.supportsStyleStrength) {
    leftCol.appendChild(el("div", { className: "control-group" }, [
      el("div", { className: "control-label-row" }, [
        el("label", { for: "rng-style", textContent: t("styleStrengthLabel") }),
        el("span", { className: "control-val-badge", textContent: state.styleStrength + " %" })
      ]),
      el("input", {
        id: "rng-style",
        type: "range",
        className: "studio-range",
        min: 0, max: 100, value: state.styleStrength,
        disabled: isNoEngine ? "disabled" : null,
        onInput: (e) => { state.styleStrength = Number(e.target.value); renderApp(); }
      })
    ]));
  }

  // Datengetriebener Hinweis (Capabilities -> Controls)
  leftCol.appendChild(el("div", { className: "capability-notice", textContent: state.engineKey === "engineA" ? t("capNoticeA") : t("capNoticeB") }));

  // Ausklappbarer Profi-Modus
  const proBtn = el("button", {
    type: "button",
    className: "pro-toggle-btn",
    "aria-expanded": state.proOpen ? "true" : "false",
    onClick: () => {
      state.proOpen = !state.proOpen;
      syncControlsFromState();
      renderApp();
    }
  }, [
    el("span", { textContent: state.proOpen ? t("proOpen") : t("proClosed") }),
    el("span", { className: "mini-badge", textContent: state.engineKey === "engineA" ? "8 Parameter" : "2 Parameter" })
  ]);
  leftCol.appendChild(proBtn);

  if (state.proOpen) {
    const proDrawer = el("div", { className: "pro-drawer" });

    // Steps (in beiden Engines vorhanden, aber mit unterschiedlichem Wertebereich)
    if (cap.supportsSteps) {
      const clampedSteps = Math.max(cap.supportsSteps.min, Math.min(cap.supportsSteps.max, state.steps));
      proDrawer.appendChild(el("div", { className: "control-group" }, [
        el("div", { className: "control-label-row" }, [
          el("label", { for: "rng-steps", textContent: t("stepsLabel") }),
          el("span", { className: "control-val-badge", textContent: String(clampedSteps) })
        ]),
        el("input", {
          id: "rng-steps",
          type: "range",
          className: "studio-range",
          min: cap.supportsSteps.min,
          max: cap.supportsSteps.max,
          value: clampedSteps,
          onInput: (e) => { state.steps = Number(e.target.value); renderApp(); }
        })
      ]));
    }

    // CFG (nur Engine A)
    if (cap.supportsCfg) {
      proDrawer.appendChild(el("div", { className: "control-group" }, [
        el("div", { className: "control-label-row" }, [
          el("label", { for: "rng-cfg", textContent: t("cfgLabel") }),
          el("span", { className: "control-val-badge", textContent: state.cfg.toFixed(1) })
        ]),
        el("input", {
          id: "rng-cfg",
          type: "range",
          className: "studio-range",
          min: cap.supportsCfg.min,
          max: cap.supportsCfg.max,
          step: cap.supportsCfg.step,
          value: state.cfg,
          onInput: (e) => { state.cfg = Number(e.target.value); renderApp(); }
        })
      ]));
    }

    // Sampler (nur Engine A)
    if (cap.samplers && cap.samplers.length) {
      const sel = el("select", {
        id: "sel-sampler",
        className: "studio-select",
        onChange: (e) => { state.sampler = e.target.value; }
      });
      cap.samplers.forEach(s => {
        const opt = el("option", { value: s, textContent: s });
        if (s === state.sampler) opt.selected = true;
        sel.appendChild(opt);
      });
      proDrawer.appendChild(el("div", { className: "control-group" }, [
        el("label", { for: "sel-sampler", className: "control-label-row", textContent: t("samplerLabel") }),
        sel
      ]));
    }

    // Seed (beide Engines: fix oder zufällig + kopierbar)
    proDrawer.appendChild(el("div", { className: "control-group" }, [
      el("label", { for: "inp-seed", className: "control-label-row", textContent: t("seedLabel") }),
      el("div", { className: "seed-row" }, [
        el("input", {
          id: "inp-seed",
          type: "text",
          className: "studio-input",
          value: state.randomSeed ? "Zufällig (-1)" : state.seed,
          onInput: (e) => { state.seed = e.target.value; state.randomSeed = false; }
        }),
        el("button", {
          type: "button",
          className: "icon-btn",
          title: "Zufälligen Seed würfeln",
          onClick: () => {
            state.seed = String(Math.floor(100000000 + Math.random() * 900000000));
            state.randomSeed = false;
            renderApp();
            showToast("Neuer Seed gewürfelt: " + state.seed);
          }
        }, ["🎲"]),
        el("button", {
          type: "button",
          className: "icon-btn",
          title: "Seed kopieren",
          onClick: () => showToast("Seed " + state.seed + " in Zwischenablage kopiert")
        }, ["📋"])
      ])
    ]));

    // Negativer Prompt (nur Engine A)
    if (cap.supportsNegativePrompt) {
      proDrawer.appendChild(el("div", { className: "control-group" }, [
        el("label", { for: "inp-neg", className: "control-label-row", textContent: t("negPromptLabel") }),
        el("textarea", {
          id: "inp-neg",
          className: "studio-textarea",
          rows: 2,
          textContent: state.negativePrompt,
          onInput: (e) => { state.negativePrompt = e.target.value; }
        })
      ]));
    }

    // Checkpoint & LoRA (LoRA nur Engine A)
    if (cap.checkpoints) {
      const selCkpt = el("select", { className: "studio-select", "aria-label": t("checkpointLabel") });
      cap.checkpoints.forEach(c => selCkpt.appendChild(el("option", { value: c, textContent: c })));
      proDrawer.appendChild(el("div", { className: "control-group" }, [
        el("span", { className: "control-label-row", textContent: t("checkpointLabel") }),
        selCkpt
      ]));
    }

    if (cap.loras) {
      const selLora = el("select", { className: "studio-select", "aria-label": t("loraLabel") });
      cap.loras.forEach(l => selLora.appendChild(el("option", { value: l, textContent: l })));
      proDrawer.appendChild(el("div", { className: "control-group" }, [
        el("span", { className: "control-label-row", textContent: t("loraLabel") }),
        selLora
      ]));
    }

    // Exakte Auflösung (Read-only abgeleitet aus Aspect Ratio)
    const activeAr = cap.aspectRatios.find(a => a.id === state.aspectRatio) || cap.aspectRatios[0];
    proDrawer.appendChild(el("div", { className: "control-label-row" }, [
      el("span", { textContent: t("resLabel") }),
      el("span", { className: "control-val-badge", textContent: `${activeAr.w} × ${activeAr.h} px` })
    ]));

    leftCol.appendChild(proDrawer);
  }

  wrap.appendChild(leftCol);

  /* --------------------------------------------------------------------------
     SPALTE MITTE: PROMPT-DOCK, BÜHNE / LEINWAND, 14 VORLAGEN

  // Prompt Action Buttons
  const actionsRow = el("div", { className: "prompt-actions-row" }, [

      el("button", {
        type: "button",
        className: "icon-btn",
        onClick: () => {
          state.viewState = "enhancing";
          syncControlsFromState();
          renderApp();
        }
      }, [t("btnEnhance")]),
      el("button", {
        type: "button",
        className: "icon-btn",
        onClick: () => {
          const newId = "custom-" + (state.templates.length + 1);
          state.templates.unshift({

            defaultMotiv: "deinem Wunschmotiv",

    el("button", {

      onClick: () => {

        state.viewState = state.viewState === "generating" ? "done" : "generating";
        syncControlsFromState();
        renderApp();
      }
    }, [
      el("span", { textContent: state.viewState === "generating" ? t("btnGenerating") : t("btnGenerate") }),
      el("kbd", { className: "shortcut-kbd", textContent: "Ctrl+↵" })

  promptDock.appendChild(actionsRow);
  centerCol.appendChild(promptDock);

  // 2. Zentrale Bühne (zustandsabhängig: Leer, Generierend, Wartend, Fertig, Fehler, Keine Engine + Inpaint/Upscale)
  const stageBox = el("div", { className: "stage-container", role: "region", "aria-live": "polite", "aria-label": "Bildbühne" });

  if (state.viewState === "no-engine") {
    // Zustand 7: Keine Engine installiert (im Ton von LocalAiRuntimeControls.tsx)
    stageBox.appendChild(el("div", { className: "studio-panel", style: "max-width:600px;text-align:center;align-items:center;" }, [
      el("div", { style: "font-size:36px;", "aria-hidden": "true", textContent: "🔌" }),
      el("h3", { style: "font-size:18px;font-weight:800;", textContent: t("noEngineTitle") }),
      el("p", { style: "font-size:13px;color:var(--lb-muted);line-height:1.5;", textContent: t("noEngineDesc") }),
      el("div", { className: "capability-notice", style: "text-align:left;width:100%;" }, [
        el("div", { textContent: "• Laufzeit-Status: stopped / noch nicht installiert (0 MiB belegt)" }),
        el("div", { textContent: "• Unterstützte lokale Backends: ComfyUI Local (Port 8188), FastSD LCM (ONNX/DirectML)" }),
        el("div", { textContent: "• Gerätetest: Noch kein Kaltstart- oder Latenz-Probelauf durchgeführt" })
      ]),
      el("div", { className: "seed-row" }, [
        el("button", {
          type: "button",
          className: "cta-generate-btn",
          onClick: () => {
            state.page = "settings";
            syncControlsFromState();
            renderApp();
          }
        }, [t("noEngineAction")]),
        el("button", {
          type: "button",
          className: "icon-btn",
          onClick: () => {
            state.viewState = "empty";
            syncControlsFromState();
            renderApp();
            showToast("Lokale Engine erkannt und verbunden!");
          }
        }, ["Lokale Engine erneut prüfen"])
      ])
    ]));
  } else if (state.viewState === "error") {
    // Zustand 6: Fehler (Prompt bleibt erhalten, klare Diagnose)
    stageBox.appendChild(el("div", { className: "studio-panel", style: "max-width:580px;border-color:var(--status-err);" }, [
      el("div", { className: "panel-header" }, [
        el("h3", { style: "font-size:16px;font-weight:800;color:var(--status-err);", textContent: "⚠️ " + t("errTitle") }),

      el("p", { style: "font-size:13px;color:var(--lb-muted);line-height:1.5;", textContent: t("errDesc") }),
      el("div", { className: "seed-row" }, [
        el("button", {
          type: "button",
          className: "cta-generate-btn",
          onClick: () => { state.viewState = "generating"; syncControlsFromState(); renderApp(); }
        }, ["↻ " + t("btnRetry")]),
        el("button", {
          type: "button",
          className: "icon-btn",
          onClick: () => {
            state.batchCount = 1;
            state.viewState = "done";
            syncControlsFromState();
            renderApp();
            showToast("Auf 1 Bild reduziert und erfolgreich gerendert!");
          }
        }, ["⚡ " + t("btnQuickFix")])
      ])
    ]));
  } else if (state.viewState === "waiting") {
    // Zustand 4: Wartend in der gemeinsamen Queue
    stageBox.appendChild(el("div", { className: "canvas-viewport" }, [
      el("div", { className: "queue-priority-banner" }, [
        el("div", {}, [
          el("strong", { textContent: "⏳ Wartet in der gemeinsamen Engine-Queue (Platz 2) · " }),
          el("span", { textContent: t("queueBannerWait") })
        ]),
        el("button", {
          type: "button",
          className: "icon-btn",
          onClick: () => { state.page = "queue"; syncControlsFromState(); renderApp(); }
        }, ["Queue öffnen →"])
      ]),
      el("div", { className: "capability-notice", style: "max-width:640px;" }, [
        el("strong", { textContent: "Warum wartet dieser Auftrag? " }),
        el("span", { textContent: "LastBrowser teilt sich eine lokale Bild-Engine zwischen Chat und Imagine. Laufende oder neue Aufträge aus dem sichtbaren Chat haben Vorrang, damit dein Gespräch flüssig bleibt." })
      ]),
      el("button", {
        type: "button",
        className: "icon-btn",
        onClick: () => { state.viewState = "empty"; syncControlsFromState(); renderApp(); }
      }, ["✕ " + t("btnCancelJob")])
    ]));
  } else if (state.viewState === "generating") {
    // Zustand 3: Generierend (Fortschritt + Live-Vorschau schält sich aus Rauschen)
    const viewport = el("div", { className: "canvas-viewport" });
    viewport.appendChild(el("div", { className: "queue-priority-banner" }, [
      el("span", { textContent: "⚡ " + t("queueBannerGen") }),
      el("button", {
        type: "button",
        className: "icon-btn",
        onClick: () => { state.viewState = "empty"; syncControlsFromState(); renderApp(); }

    viewport.appendChild(el("div", { className: "progress-bar-track" }, [

    const cnv = el("canvas", {
      className: "imagine-main-canvas",
      width: 520,
      height: 320,
      role: "img",
      "aria-label": "Live-Vorschau während der Generierung: " + state.prompt

    renderProceduralArtwork(cnv, {
      hue: 198,
      noiseLevel: cap.supportsLivePreview ? 0.42 : 0.85,
      caption: cap.supportsLivePreview ? "LIVE-LATENT-VORSCHAU · SCHRITT 19/28" : "ENGINE B LIEFERT VORSCHAU ERST BEI 100 %"

  } else {
    // Zustand 1 (Leer/Erststart mit interaktiver Modus-Bühne) oder Zustand 5 (Fertig mit Ausgabe-Aktionen)
    const viewport = el("div", { className: "canvas-viewport", style: "width:100%;" });

    if (state.mode === "inpaint") {
      // Interaktives Inpainting-Canvas (Nutzer kann direkt mit der Maus darauf zeichnen!)
      const cnv = el("canvas", {
        className: "imagine-main-canvas",
        width: 560,
        height: 340,
        style: "cursor:crosshair;",
        role: "img",
        "aria-label": "Inpainting-Leinwand zum Zeichnen der Maske: " + state.prompt
      });
      renderProceduralArtwork(cnv, { hue: 195, caption: "INPAINTING-BÜHNE · MIT MAUS AUF DEM BILD MALEN" });
      const ctx = cnv.getContext("2d");
      // Initial sample mask stroke
      ctx.fillStyle = state.inpaintInverted ? "rgba(244, 63, 94, 0.42)" : "rgba(0, 217, 255, 0.48)";
      ctx.beginPath();
      ctx.arc(280, 155, 46, 0, Math.PI * 2);
      ctx.fill();

      let painting = false;
      cnv.addEventListener("pointerdown", (ev) => {
        painting = true;
        const rect = cnv.getBoundingClientRect();
        const x = (ev.clientX - rect.left) * (cnv.width / rect.width);
        const y = (ev.clientY - rect.top) * (cnv.height / rect.height);
        ctx.fillStyle = state.inpaintTool === "eraser" ? "rgba(10, 20, 40, 0.85)" : "rgba(0, 217, 255, 0.55)";
        ctx.beginPath();
        ctx.arc(x, y, state.inpaintBrushSize, 0, Math.PI * 2);
        ctx.fill();
      });
      cnv.addEventListener("pointermove", (ev) => {
        if (!painting) return;
        const rect = cnv.getBoundingClientRect();
        const x = (ev.clientX - rect.left) * (cnv.width / rect.width);
        const y = (ev.clientY - rect.top) * (cnv.height / rect.height);
        ctx.fillStyle = state.inpaintTool === "eraser" ? "rgba(10, 20, 40, 0.85)" : "rgba(0, 217, 255, 0.55)";
        ctx.beginPath();
        ctx.arc(x, y, state.inpaintBrushSize, 0, Math.PI * 2);
        ctx.fill();
      });
      window.addEventListener("pointerup", () => { painting = false; }, { once: true });
      viewport.appendChild(cnv);
    } else if (state.mode === "upscale") {
      // Interaktiver Vorher/Nachher-Upscale-Vergleich
      const cnv = el("canvas", {
        className: "imagine-main-canvas",
        width: 560,
        height: 340,
        role: "img",
        "aria-label": "Upscale Vorher/Nachher-Vergleich: " + state.prompt
      });
      renderProceduralArtwork(cnv, { hue: 175, upscaleSplit: state.upscaleSplit });
      viewport.appendChild(cnv);
      viewport.appendChild(el("div", { className: "control-group", style: "width:100%;max-width:420px;" }, [
        el("div", { className: "control-label-row" }, [
          el("label", { for: "rng-upscale-split", textContent: "Vorher / Nachher Trennlinie verschieben" }),
          el("span", { className: "control-val-badge", textContent: state.upscaleSplit + " %" })
        ]),
        el("input", {
          id: "rng-upscale-split",
          type: "range",
          className: "studio-range",
          min: 5, max: 95, value: state.upscaleSplit,
          onInput: (e) => {
            state.upscaleSplit = Number(e.target.value);
            renderProceduralArtwork(cnv, { hue: 175, upscaleSplit: state.upscaleSplit });
          }
        })
      ]));
    } else if (state.viewState === "done") {
      // Zustand 5: Fertig (Ergebnis-Raster + Glanz-Banner + Alle 8 Ausgabe-Aktionen)
      viewport.appendChild(el("div", { className: "capability-notice", style: "width:100%;max-width:720px;display:flex;justify-content:space-between;align-items:center;" }, [
        el("span", { textContent: "✨ Glanz-Moment: Automatisch gespeichert unter „" + state.outputPath + "2026-10-15_cyberpunk_" + state.seed + ".png“" }),
        el("span", { className: "mini-badge", textContent: "Seed: " + state.seed })
      ]));

      const grid = el("div", { className: "results-grid" });
      const count = Math.min(state.batchCount, cap.maxBatch);
      for (let i = 0; i < count; i++) {
        const card = el("div", {
          className: "result-card" + (state.selectedResultIndex === i ? " selected" : ""),
          tabIndex: 0,
          role: "button",
          "aria-label": `Ergebnisbild ${i + 1} auswählen (${state.prompt})`,
          onClick: () => { state.selectedResultIndex = i; renderApp(); }
        });
        const cnv = el("canvas", { width: 360, height: 240, "aria-label": state.prompt });
        renderProceduralArtwork(cnv, { hue: (195 + i * 38) % 360, caption: `VARIANTE #${i + 1} · SEED ${Number(state.seed) + i}` });
        card.appendChild(cnv);
        grid.appendChild(card);
      }
      viewport.appendChild(grid);

      // Vollständige Ausgabe-Aktionsleiste (Abschnitt 2.9)
      const outBar = el("div", { className: "output-action-bar", role: "toolbar", "aria-label": "Bild-Ausgabeaktionen" });
      const actions = [
        { icon: "💾", label: t("actSaveAs"), msg: "Dialog „Speichern unter …“ geöffnet" },
        { icon: "📋", label: t("actCopyImg"), msg: "Bild in die System-Zwischenablage kopiert" },
        { icon: "💬", label: t("actSendChat"), msg: "Bild direkt an den aktiven Sidekick-Chat übergeben" },
        { icon: "🪄", label: t("actVariant"), fn: () => { state.mode = "img2img"; syncControlsFromState(); renderApp(); showToast("Bild als Bild→Bild-Variante übernommen"); } },
        { icon: "🔑", label: t("actCopyMeta"), msg: "Prompt + Seed (" + state.seed + ") kopiert" },
        { icon: "↻", label: t("actRerun"), fn: () => { state.viewState = "generating"; syncControlsFromState(); renderApp(); } },
        { icon: "📂", label: t("actShowFolder"), msg: "Ordner „" + state.outputPath + "“ im Dateimanager geöffnet" },
        { icon: "🗑️", label: t("actDelete"), fn: () => { state.viewState = "empty"; syncControlsFromState(); renderApp(); showToast("Ergebnis verworfen"); } }
      ];
      actions.forEach(a => {
        outBar.appendChild(el("button", {
          type: "button",
          className: "icon-btn",
          onClick: a.fn || (() => showToast(a.msg))
        }, [el("span", { "aria-hidden": "true", textContent: a.icon }), el("span", { textContent: a.label })]));
      });
      viewport.appendChild(outBar);
    } else {
      // Zustand 1: Leer / Erststart (Einladende Studio-Vorschau)
      const cnv = el("canvas", {
        className: "imagine-main-canvas",
        width: 560,
        height: 310,
        role: "img",
        "aria-label": "Vorschau der ausgewählten Vorlage: " + state.prompt
      });
      renderProceduralArtwork(cnv, { hue: 205, caption: "BEREIT · DRÜCKE STRG+ENTER ODER WÄHLE EINE VORLAGE UNTEN" });
      viewport.appendChild(cnv);
    }

    stageBox.appendChild(viewport);
  }
  centerCol.appendChild(stageBox);

  // 3. Prompt-Vorlagen (14 Beispielvorlagen in 6 Kategorien + Eigene)
  const tplPanel = el("div", { className: "studio-panel" });
  const cats = ["Alle", "Foto", "Illustration", "Icon", "Wallpaper", "Produkt", "Comic", "Eigene"];
  const catChips = el("div", { className: "category-chips", role: "group", "aria-label": "Vorlagen-Kategorien" });
  cats.forEach(c => {
    catChips.appendChild(el("button", {
      type: "button",
      className: "cat-chip",
      "aria-pressed": state.selectedCategory === c ? "true" : "false",
      onClick: () => { state.selectedCategory = c; renderApp(); }
    }, [c]));
  });

  tplPanel.appendChild(el("div", { className: "templates-header-bar" }, [
    el("h3", { className: "panel-title", textContent: "✨ " + t("templatesTitle") }),
    catChips
  ]));

  const tplGrid = el("div", { className: "template-grid" });
  const visibleTemplates = state.templates.filter(item => state.selectedCategory === "Alle" || item.cat === state.selectedCategory);
  visibleTemplates.forEach(item => {
    const card = el("button", {
      type: "button",
      className: "template-card",
      "aria-pressed": state.activeTemplateId === item.id ? "true" : "false",
      onClick: () => {
        state.activeTemplateId = item.id;
        state.motivValue = item.defaultMotiv;
        state.prompt = item.prompt.replace("{motiv}", item.defaultMotiv);
        renderApp();

      }

      el("div", { className: "template-preview-swatch", style: `background:${item.grad};` }, [

  tplPanel.appendChild(tplGrid);
  centerCol.appendChild(tplPanel);

  wrap.appendChild(centerCol);

  /* --------------------------------------------------------------------------
     SPALTE RECHTS: SIDEKICK PROMPT-ASSISTENT (Avatar v2 + Diff + Modellwahl)
     -------------------------------------------------------------------------- */
  const rightCol = el("aside", { className: "studio-panel imagine-sidekick-col", "aria-label": t("sidekickTitle") });
  const avState = mapViewStateToAvatarState();
  const pInfo = PERSONAS[state.persona] || PERSONAS.spark;

  const skHeader = el("div", { className: "sidekick-header-card" }, [
    (() => {
      const stg = el("div", { className: "avatar-v2-stage" });
      stg.appendChild(createSidekickAvatarSVG(state.persona, avState));

    })(),
    el("div", { style: "display:flex;flex-direction:column;gap:3px;" }, [
      el("div", { style: "display:flex;align-items:center;gap:6px;" }, [
        el("strong", { style: "font-size:15px;", textContent: pInfo.name }),
        el("span", { className: "mini-badge", textContent: "v2 · " + avState.toUpperCase() })
      ]),
      el("span", { style: "font-size:12px;color:var(--lb-muted);", textContent: pInfo.role }),
      el("span", { style: "font-size:11px;color:var(--lb-accent);", textContent: "Verbessert Prompts & Lichtstimmung" })
    ])

  rightCol.appendChild(skHeader);

  // Persona Quick-Switcher (analog CompanionPicker.tsx)
  const personaBar = el("div", { className: "category-chips", role: "group", "aria-label": "Sidekick Persona wählen" });

  // Prompt-Diff-Ansicht (Alt -> Neu) mit Übernehmen oder Verwerfen

  ]));

  const diffTextP = el("p", {}, [
    "Kinoreifes 85mm-Porträt von ",
    el("span", { className: "diff-del", textContent: "einer Cyberpunk-Uhrmacherin" }),
    " ",
    el("span", { className: "diff-ins", textContent: state.motivValue + " mit filigraner Messing-Lupe" }),
    " im warmen Neonregen von Tokio, ",
    el("span", { className: "diff-ins", textContent: "volumetrisches Gegenlicht, Cyan-Amber-Farbkorrektur, " }),

  diffBox.appendChild(diffTextP);

    styleChips.appendChild(el("button", {
      type: "button",

      onClick: () => {

        showToast("Stil-Ergänzung „" + tag + "“ angehängt");

  diffBox.appendChild(styleChips);

  diffBox.appendChild(el("div", { className: "seed-row" }, [
    el("button", {
      type: "button",
      className: "icon-btn",
      style: "flex:1;border-color:var(--status-ok);",
      onClick: () => {
        state.prompt = `Kinoreifes 85mm-Porträt von ${state.motivValue} mit filigraner Messing-Lupe im warmen Neonregen von Tokio, volumetrisches Gegenlicht, Cyan-Amber-Farbkorrektur, feine Regentropfen auf Glas, Bokeh-Lichter, Kodak Portra 400`;
        state.viewState = "empty";
        syncControlsFromState();
        renderApp();
        showToast("Verbesserten Prompt von " + pInfo.name + " übernommen!");
      }
    }, [t("btnApplyDiff")]),
    el("button", {
      type: "button",
      className: "icon-btn",
      onClick: () => {
        state.viewState = "empty";
        syncControlsFromState();
        renderApp();
        showToast("Vorschlag verworfen – Original-Prompt behalten");
      }
    }, [t("btnDiscardDiff")])
  ]));
  rightCol.appendChild(diffBox);

  // Eigene Modellwahl des Prompt-Assistenten (analog model-picker-options.ts)
  rightCol.appendChild(el("div", { className: "control-label-row" }, [
    el("strong", { fontSize: "12px", textContent: "🧠 " + t("sidekickModelLabel") }),
    el("span", { className: "mini-badge", textContent: "Provider-Gruppiert" })
  ]));

  const modelList = el("div", { className: "model-picker-list", role: "radiogroup", "aria-label": t("sidekickModelLabel") });
  let lastGroup = "";
  ASSISTANT_MODELS.forEach(m => {
    if (m.group !== lastGroup) {
      lastGroup = m.group;
      modelList.appendChild(el("div", { className: "model-group-label", textContent: m.group }));
    }
    const isLocked = Boolean(m.disabledReason);
    const card = el("button", {
      type: "button",
      role: "radio",
      className: "model-option-card",
      "aria-checked": state.assistantModel === m.id ? "true" : "false",
      disabled: isLocked ? "disabled" : null,
      onClick: () => {
        if (isLocked) return;
        state.assistantModel = m.id;
        renderApp();
        showToast("Assistenten-Modell gewechselt zu: " + m.name);
      }
    }, [
      el("div", { style: "display:flex;justify-content:space-between;align-items:center;gap:6px;width:100%;" }, [
        el("strong", { style: "font-size:12px;", textContent: m.name }),
        el("div", { className: "model-badges-row" }, [
          m.isDefault ? el("span", { className: "mini-badge", style: "border-color:var(--lb-accent);", textContent: "DEFAULT" }) : null,
          el("span", { className: "mini-badge", textContent: m.deployment.toUpperCase() })
        ])
      ]),
      el("span", {
        style: "font-size:11px;color:var(--lb-muted);",
        textContent: isLocked ? "🔒 Gesperrt: " + m.reasonText : "✓ " + m.reasonText
      })
    ]);
    modelList.appendChild(card);
  });
  rightCol.appendChild(modelList);

  wrap.appendChild(rightCol);
  return wrap;
}

/* ============================================================================
   HAUPT-RENDER-SCHLEIFE & SYNCHRONISATION MIT DER STEUERLEISTE
   ============================================================================ */
function renderApp() {
  // Apply Theme, Accent, Reduced Motion, Lang on <html>
  const html = document.documentElement;
  html.lang = state.lang;
  html.className = state.theme;
  html.setAttribute("data-accent", state.accent);
  html.setAttribute("data-reduced-motion", String(state.reducedMotion));

  // Header I18N & Engine Status Pill
  document.getElementById("hdr-subtitle").textContent = t("hdrSub");
  document.getElementById("hdr-badge-local").textContent = t("localBadge");
  document.querySelectorAll("[data-i18n]").forEach(node => {
    const key = node.getAttribute("data-i18n");
    node.textContent = t(key);
  });

  // Update Top Navigation active state
  document.querySelectorAll(".imagine-nav-btn").forEach(btn => {
    if (btn.getAttribute("data-nav") === state.page) {
      btn.setAttribute("aria-current", "page");
    } else {
      btn.removeAttribute("aria-current");
    }
  });

  document.getElementById("queue-count-badge").textContent = String(state.queueItems.length);
  document.getElementById("gallery-count-badge").textContent = String(state.galleryItems.length);

  const led = document.getElementById("header-engine-led");
  const pillTxt = document.getElementById("header-engine-text");
  const cap = ENGINE_CAPABILITIES[state.engineKey];
  if (state.viewState === "no-engine") {
    led.className = "status-led warn";
    pillTxt.textContent = "Keine lokale Bild-Engine installiert";
  } else if (state.viewState === "error") {
    led.className = "status-led err";
    pillTxt.textContent = cap.name + " · VRAM-Warnung";
  } else {
    led.className = "status-led";
    pillTxt.textContent = `${cap.name} · Bereit (${(cap.vramFreeMiB / 1024).toFixed(1)} GiB frei)`;
  }

  // Render active page
  const root = document.getElementById("imagine-main-root");
  root.replaceChildren();
  if (state.page === "create") root.appendChild(buildCreatePage());
  else if (state.page === "queue") root.appendChild(buildQueuePage());
  else if (state.page === "gallery") root.appendChild(buildGalleryPage());
  else if (state.page === "settings") root.appendChild(buildSettingsPage());
  else if (state.page === "hub") root.appendChild(buildHubPage());
  else if (state.page === "drawer") root.appendChild(buildDrawerPage());
}

function syncControlsFromState() {
  document.getElementById("ctrl-page").value = state.page;
  document.getElementById("ctrl-state").value = state.viewState;
  document.getElementById("ctrl-mode").value = state.mode;
  document.getElementById("ctrl-engine").value = state.engineKey;
  document.getElementById("ctrl-persona").value = state.persona;
  document.getElementById("ctrl-theme").value = state.theme;

  const proBtn = document.getElementById("ctrl-pro");
  proBtn.setAttribute("aria-pressed", String(state.proOpen));
  proBtn.textContent = state.proOpen ? "Profi-Modus: Offen" : "Profi-Modus: Zu";

  const motBtn = document.getElementById("ctrl-motion");
  motBtn.setAttribute("aria-pressed", String(state.reducedMotion));
  motBtn.textContent = state.reducedMotion ? "Reduced Motion: An" : "Reduced Motion: Aus";

  const langBtn = document.getElementById("ctrl-lang");
  langBtn.setAttribute("aria-pressed", state.lang === "en" ? "true" : "false");
  langBtn.textContent = "Sprache: " + state.lang.toUpperCase();

  document.querySelectorAll(".accent-dot").forEach(dot => {
    dot.setAttribute("aria-pressed", String(dot.getAttribute("data-set-accent") === state.accent));
  });
}

/* ============================================================================
   EVENT-LISTENER & TASTATUR-SHORTCUTS (CSP-SAFE)
   ============================================================================ */
document.getElementById("ctrl-page").addEventListener("change", (e) => { state.page = e.target.value; renderApp(); });
document.getElementById("ctrl-state").addEventListener("change", (e) => { state.viewState = e.target.value; state.page = "create"; syncControlsFromState(); renderApp(); });
document.getElementById("ctrl-mode").addEventListener("change", (e) => { state.mode = e.target.value; state.page = "create"; syncControlsFromState(); renderApp(); });
document.getElementById("ctrl-engine").addEventListener("change", (e) => { state.engineKey = e.target.value; renderApp(); });
document.getElementById("ctrl-persona").addEventListener("change", (e) => { state.persona = e.target.value; renderApp(); });
document.getElementById("ctrl-theme").addEventListener("change", (e) => { state.theme = e.target.value; renderApp(); });

document.getElementById("ctrl-pro").addEventListener("click", () => {
  state.proOpen = !state.proOpen;
  syncControlsFromState();
  renderApp();
});
document.getElementById("ctrl-motion").addEventListener("click", () => {
  state.reducedMotion = !state.reducedMotion;
  syncControlsFromState();
  renderApp();
});
document.getElementById("ctrl-lang").addEventListener("click", () => {
  state.lang = state.lang === "de" ? "en" : "de";
  syncControlsFromState();
  renderApp();
});

document.querySelectorAll(".accent-dot").forEach(dot => {
  dot.addEventListener("click", () => {
    state.accent = dot.getAttribute("data-set-accent");
    syncControlsFromState();
    renderApp();
  });
});

document.querySelectorAll(".imagine-nav-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    state.page = btn.getAttribute("data-nav");
    syncControlsFromState();
    renderApp();
  });
});

// Globale Tastatur-Shortcuts (Strg+Enter = Erzeugen, Esc = Abbrechen/Verwerfen)
window.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
    if (state.viewState !== "no-engine") {
      e.preventDefault();
      state.page = "create";
      state.viewState = state.viewState === "generating" ? "done" : "generating";
      syncControlsFromState();
      renderApp();
      showToast(state.viewState === "generating" ? "Generierung per Strg+Enter gestartet" : "Generierung abgeschlossen");
    }
  } else if (e.key === "Escape") {
    if (state.viewState === "generating" || state.viewState === "enhancing" || state.viewState === "waiting") {
      state.viewState = "empty";
      syncControlsFromState();
      renderApp();
      showToast("Vorgang per Esc abgebrochen");
    }
  }
});

// Initial Render
syncControlsFromState();
renderApp();
</script>
</body>
</html>
