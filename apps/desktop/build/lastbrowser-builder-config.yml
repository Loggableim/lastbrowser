appId: com.lastbrowser.desktop
productName: Lastbrowser
npmRebuild: false
electronVersion: 37.10.3+wvcus
electronDownload:
  mirror: https://github.com/castlabs/electron-releases/releases/download/v
directories:
  app: .
  output: release
files:
  - dist/**/*
  - package.json
  - node_modules/node-pty/**/*
asarUnpack:
  - node_modules/node-pty/**/*
extraResources:
  - from: ../../services
    to: services
    filter:
      - '**/*'
      - '!**/__pycache__/**'
      - '!**/.pytest_cache/**'
      - '!**/.test-tmp/**'
      - '!**/.ruff_cache/**'
      - '!**/*.egg-info/**'
      - '!**/build/lib/**'
  - from: ../../brand
    to: brand
  - from: runtime/python
    to: runtime/python
protocols:
  - name: HTTP Web Link
    schemes: [http]
  - name: HTTPS Secure Web Link
    schemes: [https]
fileAssociations:
  - ext: html
    name: HTML Document
  - ext: htm
    name: HTML Document
  - ext: shtml
    name: HTML Document
  - ext: xhtml
    name: XHTML Document
win:
  target: [nsis, portable]
  icon: build/icon.ico
nsis:
  artifactName: Lastbrowser-${version}-${arch}-setup.${ext}
  include: build/installer.nsh
  oneClick: true
  runAfterFinish: true
  installerHeaderIcon: build/icon.ico
  installerLanguages: [en_US, de_DE]
  language: "1033"
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Lastbrowser
portable:
  artifactName: Lastbrowser-${version}-${arch}-portable.${ext}
publish:
  - provider: github
    owner: Loggableim
    repo: lastbrowser
    releaseType: release
