name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer, Authenticode, and VMP signing
    runs-on: windows-latest
    outputs:
      metadata: ${{ steps.release-channel.outputs.metadata }}
      prerelease: ${{ steps.release-channel.outputs.prerelease }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require a version-matched release tag
        id: release-channel
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if ($env:RELEASE_REF -notmatch '^refs/tags/v(\d+\.\d+\.\d+)(?:-beta\.(\d+))?$') {
            throw "Refusing release: expected vX.Y.Z or v0.1.57-beta.N, got '$env:RELEASE_REF'."
          }
          $baseVersion = $Matches[1]
          $betaSequence = $Matches[2]
          $isBeta = -not [string]::IsNullOrWhiteSpace($betaSequence)
          $tagVersion = if ($isBeta) { "$baseVersion-beta.$betaSequence" } else { $baseVersion }
          $package = Get-Content 'apps/desktop/package.json' -Raw | ConvertFrom-Json
          if ($tagVersion -ne $package.version) {
            throw "Refusing release: tag version v$tagVersion does not match desktop package version $($package.version)."
          }
          if ($isBeta -and [version]$baseVersion -lt [version]'0.1.57') {
            throw "Refusing beta release: beta releases start at the 0.1.57 line, got '$env:RELEASE_REF'."
          }
          $channel = if ($isBeta) { 'beta' } else { 'latest' }
          $metadataFile = if ($isBeta) { 'beta.yml' } else { 'latest.yml' }
          "channel=$channel" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "prerelease=$($isBeta.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "metadata=$metadataFile" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Require signing credentials before release setup
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_CERTIFICATE_PROFILE: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
          WINDOWS_SIGNING_PUBLISHER_SUBJECT: ${{ vars.WINDOWS_SIGNING_PUBLISHER_SUBJECT }}
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        run: |
          $required = @(
            'AZURE_CLIENT_ID',
            'AZURE_CLIENT_SECRET',
            'AZURE_TENANT_ID',
            'AZURE_TRUSTED_SIGNING_ACCOUNT',
            'AZURE_CERTIFICATE_PROFILE',
            'WINDOWS_SIGNING_PUBLISHER_SUBJECT',
            'EVS_ACCOUNT_NAME',
            'EVS_PASSWD'
          )
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($missing.Count -gt 0) {
            throw "Cannot publish without Azure Authenticode and Castlabs VMP signing. Missing signing inputs: $($missing -join ', ')"
          }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python for installer assets
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/sidekick/pyproject.toml

      - name: Install Sidekick backend test dependencies
        working-directory: services/sidekick
        run: python -m pip install --disable-pip-version-check -e ".[web,all,dev]"

      - name: Check Sidekick Python syntax
        run: python -m compileall -q services/sidekick

      - name: Test Sidekick backend
        working-directory: services/sidekick
        run: python -m pytest

      - name: Install installer asset dependency
        run: python -m pip install --disable-pip-version-check Pillow castlabs-evs

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test:run

      - name: Verify Microsoft Store release readiness
        run: npm run verify:store

      - name: Provision pinned Windows Python wheels
        run: npm --workspace apps/desktop run prepare:python -- --download-wheels

      - name: Prepare Python runtime
        run: npm --workspace apps/desktop run prepare:python

      - name: Provision pinned Windows protected Space dependencies
        run: npm --workspace apps/desktop run prepare:space-runtime:online

      - name: Stage the Windows protected Space runtime
        run: npm --workspace apps/desktop run prepare:space-runtime

      - name: Build desktop application
        run: npm --workspace apps/desktop run build

      - name: Install the Artifact Signing client module
        shell: pwsh
        run: Install-Module -Name TrustedSigning -RequiredVersion '0.5.3' -Scope CurrentUser -Repository PSGallery -Force

      - name: Package Windows installers with VMP signing
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_CERTIFICATE_PROFILE: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT || 'https://weu.codesigning.azure.net/' }}
          WINDOWS_SIGNING_PUBLISHER_SUBJECT: ${{ vars.WINDOWS_SIGNING_PUBLISHER_SUBJECT }}
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
          EVS_REQUIRED: '1'
          EVS_NO_ASK: '1'
          EVS_REQUIRE_EXPLICIT_CREDENTIALS: '1'
          RELEASE_CHANNEL: ${{ steps.release-channel.outputs.channel }}
          RELEASE_TYPE: ${{ steps.release-channel.outputs.prerelease == 'true' && 'prerelease' || 'release' }}
        run: |
          $config = (Get-Content 'apps/desktop/package.json' -Raw | ConvertFrom-Json).build
          $config | Add-Member -NotePropertyName forceCodeSigning -NotePropertyValue $true -Force
          $config.win.signAndEditExecutable = $true
          $config.win.verifyUpdateCodeSignature = $true
          $config.win | Add-Member -NotePropertyName signtoolOptions -NotePropertyValue @{
            sign = 'scripts/azure-windows-sign.cjs'
            signingHashAlgorithms = @('sha256')
            publisherName = $env:WINDOWS_SIGNING_PUBLISHER_SUBJECT
          } -Force
          $config.publish[0].channel = $env:RELEASE_CHANNEL
          $config.publish[0].releaseType = $env:RELEASE_TYPE
          $configPath = Join-Path $env:RUNNER_TEMP 'lastbrowser-signed-release.json'
          $config | ConvertTo-Json -Depth 40 | Set-Content -LiteralPath $configPath -Encoding utf8
          npm --workspace apps/desktop exec -- electron-builder --win nsis portable --publish never --config $configPath
          if ($LASTEXITCODE -ne 0) { throw 'Signed package build failed.' }

      - name: Require exactly the expected Windows executables
        shell: pwsh
        run: |
          $version = (Get-Content 'apps/desktop/package.json' -Raw | ConvertFrom-Json).version
          $expected = @(
            "Lastbrowser-$version-x64-setup.exe",
            "Lastbrowser-$version-x64-portable.exe"
          ) | Sort-Object
          $actual = @(Get-ChildItem -Path 'apps/desktop/release' -File -Filter '*.exe' | ForEach-Object { $_.Name } | Sort-Object)
          if ($actual.Count -ne 2 -or (Compare-Object -ReferenceObject $expected -DifferenceObject $actual)) {
            throw "Expected exactly these release executables: $($expected -join ', '). Found: $($actual -join ', ')."
          }

      - name: Refresh signed installer checksum and differential blockmap
        run: node scripts/refresh-signed-release-metadata.mjs apps/desktop/release node_modules/app-builder-bin/win/x64/app-builder.exe ${{ steps.release-channel.outputs.metadata }}

      - name: Verify Authenticode Signature
        shell: pwsh
        env:
          WINDOWS_SIGNING_PUBLISHER_SUBJECT: ${{ vars.WINDOWS_SIGNING_PUBLISHER_SUBJECT }}
        run: |
          $version = (Get-Content 'apps/desktop/package.json' -Raw | ConvertFrom-Json).version
          $releaseDir = 'apps/desktop/release'
          $packageDir = Join-Path $releaseDir 'win-unpacked'
          $setup = Join-Path $releaseDir "Lastbrowser-$version-x64-setup.exe"
          $portable = Join-Path $releaseDir "Lastbrowser-$version-x64-portable.exe"
          $executables = Get-Item -LiteralPath @((Join-Path $packageDir 'Lastbrowser.exe'), $setup, $portable)
          if (-not (Get-Command signtool.exe -ErrorAction SilentlyContinue)) {
            $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
            $tool = Get-ChildItem -LiteralPath $sdkBin -Recurse -File -Filter 'signtool.exe' |
              Where-Object { $_.Directory.Name -eq 'x64' } | Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $tool) { throw 'Windows SDK x64 SignTool is required for release verification.' }
            $env:PATH = $tool.DirectoryName + [IO.Path]::PathSeparator + $env:PATH
          }
          foreach ($executable in $executables) {
            Write-Host "Verifying signature for: $($executable.FullName)"
            & signtool.exe verify /pa /v $executable.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Authenticode verification failed for $($executable.Name) with exit code $LASTEXITCODE"
            }
            $signature = Get-AuthenticodeSignature -LiteralPath $executable.FullName
            if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate -or
                $signature.SignerCertificate.Subject -cne $env:WINDOWS_SIGNING_PUBLISHER_SUBJECT) {
              throw "Wrong, invalid, or untimestamped signing identity for $($executable.Name)."
            }
          }
          & ./scripts/verify-windows-package-signatures.ps1 -PackageDirectory $packageDir -InstallerPath $setup
          $checkPublisher = @'
          const fs = require('node:fs');
          const yaml = require('js-yaml');
          const config = yaml.load(fs.readFileSync(process.argv[1], 'utf8'));
          const configured = config?.publisherName;
          if (!Array.isArray(configured) || configured.length !== 1 || configured[0] !== process.env.WINDOWS_SIGNING_PUBLISHER_SUBJECT) {
            throw new Error('Packaged updater publisher does not match the authorized signing identity.');
          }
          if (typeof config.updaterCacheDirName !== 'string' || !/^[a-z0-9][a-z0-9_.-]*$/i.test(config.updaterCacheDirName)) {
            throw new Error('Packaged updater cache configuration is invalid.');
          }
          '@
          node -e $checkPublisher (Join-Path $packageDir 'resources/app-update.yml')
          if ($LASTEXITCODE -ne 0) { throw 'Packaged updater publisher verification failed.' }

      - name: Verify packaged Widevine VMP signature
        shell: powershell
        run: |
          $packageDir = 'apps/desktop/release/win-unpacked'
          if (-not (Test-Path (Join-Path $packageDir 'Lastbrowser.exe'))) {
            throw "VMP verification package is missing Lastbrowser.exe: $packageDir"
          }
          python -m castlabs_evs.vmp -n verify-pkg $packageDir
          if ($LASTEXITCODE -ne 0) {
            throw "Castlabs VMP package verification failed with exit code $LASTEXITCODE"
          }

      - name: Upload verified Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lastbrowser-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/${{ steps.release-channel.outputs.metadata }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish verified GitHub Release
    needs: windows
    if: needs.windows.result == 'success' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified Windows release artifacts
        uses: actions/download-artifact@v4
        with:
          name: lastbrowser-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.exe
            release-assets/*.blockmap
            release-assets/${{ needs.windows.outputs.metadata }}
          draft: false
          prerelease: ${{ needs.windows.outputs.prerelease }}
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
