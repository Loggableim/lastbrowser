name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer, Authenticode, and VMP signing
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require a version-matched release tag
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if ($env:RELEASE_REF -notmatch '^refs/tags/v(\d+)\.(\d+)\.(\d+)$') {
            throw "Refusing release: workflow must run from a vX.Y.Z tag, got '$env:RELEASE_REF'."
          }
          $tagVersion = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
          $package = Get-Content 'apps/desktop/package.json' -Raw | ConvertFrom-Json
          if ($tagVersion -ne $package.version) {
            throw "Refusing release: tag version v$tagVersion does not match desktop package version $($package.version)."
          }

      - name: Require signing credentials before release setup
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_CERTIFICATE_PROFILE: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        run: |
          $required = @(
            'AZURE_CLIENT_ID',
            'AZURE_CLIENT_SECRET',
            'AZURE_TENANT_ID',
            'AZURE_TRUSTED_SIGNING_ACCOUNT',
            'AZURE_CERTIFICATE_PROFILE',
            'EVS_ACCOUNT_NAME',
            'EVS_PASSWD'
          )
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($missing.Count -gt 0) {
            throw "Cannot publish without Azure Authenticode and Castlabs VMP signing. Missing required secrets: $($missing -join ', ')"
          }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python for installer assets
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/sidekick/pyproject.toml

      - name: Install Sidekick backend test dependencies
        working-directory: services/sidekick
        run: python -m pip install --disable-pip-version-check -e ".[web,all,dev]"

      - name: Check Sidekick Python syntax
        run: python -m compileall -q services/sidekick

      - name: Test Sidekick backend
        working-directory: services/sidekick
        run: python -m pytest

      - name: Install installer asset dependency
        run: python -m pip install --disable-pip-version-check Pillow castlabs-evs

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test:run

      - name: Verify Microsoft Store release readiness
        run: npm run verify:store

      - name: Prepare Python runtime
        run: npm --workspace apps/desktop run prepare:python

      - name: Build installer assets
        run: npm --workspace apps/desktop run build:installer-assets

      - name: Build desktop application
        run: npm --workspace apps/desktop run build

      - name: Package Windows installers with VMP signing
        run: npm --workspace apps/desktop exec -- electron-builder --win nsis portable --publish never
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
          EVS_REQUIRED: '1'
          EVS_NO_ASK: '1'

      - name: Require exactly the expected Windows executables
        shell: pwsh
        run: |
          $version = (Get-Content 'apps/desktop/package.json' -Raw | ConvertFrom-Json).version
          $expected = @(
            "Lastbrowser-$version-x64-setup.exe",
            "Lastbrowser-$version-x64-portable.exe"
          ) | Sort-Object
          $actual = @(Get-ChildItem -Path 'apps/desktop/release' -File -Filter '*.exe' | ForEach-Object { $_.Name } | Sort-Object)
          if ($actual.Count -ne 2 -or (Compare-Object -ReferenceObject $expected -DifferenceObject $actual)) {
            throw "Expected exactly these release executables: $($expected -join ', '). Found: $($actual -join ', ')."
          }

      - name: Sign binaries with Azure Trusted Signing (Microsoft Store / Authenticode)
        uses: Azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT || 'https://weu.codesigning.azure.net/' }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
          files: |
            apps/desktop/release/*.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Refresh signed installer checksum and differential blockmap
        run: node scripts/refresh-signed-release-metadata.mjs apps/desktop/release node_modules/app-builder-bin/win/x64/app-builder.exe

      - name: Verify Authenticode Signature
        shell: powershell
        run: |
          $version = (Get-Content 'apps/desktop/package.json' -Raw | ConvertFrom-Json).version
          $expected = @(
            "Lastbrowser-$version-x64-setup.exe",
            "Lastbrowser-$version-x64-portable.exe"
          ) | Sort-Object
          $executables = @(Get-ChildItem -Path 'apps/desktop/release' -File -Filter '*.exe')
          $actual = @($executables | ForEach-Object { $_.Name } | Sort-Object)
          if ($actual.Count -ne 2 -or (Compare-Object -ReferenceObject $expected -DifferenceObject $actual)) {
            throw "Expected exactly these signed release executables: $($expected -join ', '). Found: $($actual -join ', ')."
          }
          foreach ($executable in $executables) {
            Write-Host "Verifying signature for: $($executable.FullName)"
            & signtool.exe verify /pa /v $executable.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Authenticode verification failed for $($executable.Name) with exit code $LASTEXITCODE"
            }
          }

      - name: Verify packaged Widevine VMP signature
        shell: powershell
        run: |
          $packageDir = 'apps/desktop/release/win-unpacked'
          if (-not (Test-Path (Join-Path $packageDir 'Lastbrowser.exe'))) {
            throw "VMP verification package is missing Lastbrowser.exe: $packageDir"
          }
          python -m castlabs_evs.vmp -n verify-pkg $packageDir
          if ($LASTEXITCODE -ne 0) {
            throw "Castlabs VMP package verification failed with exit code $LASTEXITCODE"
          }

      - name: Upload verified Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lastbrowser-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish verified GitHub Release
    needs: windows
    if: needs.windows.result == 'success' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified Windows release artifacts
        uses: actions/download-artifact@v4
        with:
          name: lastbrowser-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.exe
            release-assets/*.blockmap
            release-assets/latest.yml
          draft: false
          prerelease: false
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
